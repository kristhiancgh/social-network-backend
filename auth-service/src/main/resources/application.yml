# =============================================================================
#  auth-service
# =============================================================================
server:
  port: ${SERVER_PORT:8081}
  error:
    # The whitelabel page and Spring's default error body would bypass the
    # RFC 7807 contract, so both are switched off.
    whitelabel:
      enabled: false
  shutdown: graceful

spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb?escapeSyntaxCallMode=call}
    username: ${SPRING_DATASOURCE_USERNAME:auth_service}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_dev_pwd}
    hikari:
      pool-name: auth-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# --- Swagger UI at /docs, as required ----------------------------------------
springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    issuer: social-network
    access-token-ttl: 2h
    clock-skew: 30s

  openapi:
    title: Authentication API
    version: 1.0.0
    description: >
      Login, registration and JWT issuing. This is the only service that signs
      tokens; the other three merely verify them.
    gateway-url: ${GATEWAY_URL:http://localhost:8080}

  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}

  login-policy:
    max-failed-attempts: ${APP_MAX_FAILED_ATTEMPTS:5}
    window-minutes: ${APP_LOCKOUT_WINDOW_MINUTES:15}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    dev.social: INFO
