# =============================================================================
#  like-service
#  The only service with a WebSocket endpoint.
# =============================================================================
server:
  port: ${SERVER_PORT:8084}
  error:
    whitelabel:
      enabled: false
  shutdown: graceful

spring:
  application:
    name: like-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/likedb}
    username: ${SPRING_DATASOURCE_USERNAME:like_service}
    password: ${SPRING_DATASOURCE_PASSWORD:like_dev_pwd}
    hikari:
      pool-name: like-pool
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    issuer: social-network
    access-token-ttl: 2h
    clock-skew: 30s

  openapi:
    title: Likes API
    version: 1.0.0
    description: >
      Toggling likes and reading totals. Every change is also broadcast over
      STOMP/WebSocket at /ws to /topic/likes and /topic/posts/{postId}/likes.
    gateway-url: ${GATEWAY_URL:http://localhost:8080}

  seeder:
    enabled: ${APP_SEEDER_ENABLED:true}

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{36} - %msg%n"
  level:
    dev.social: INFO
